name: anaqatuk
description: أناقتك — سوق المصممات السعوديات (بيع وتأجير)
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^14.2.0

  # Networking
  dio: ^5.5.0

  # Secure token storage
  flutter_secure_storage: ^9.2.2

  # Fonts (El Messiri + IBM Plex Sans Arabic)
  google_fonts: ^6.2.1

  # Arabic-Indic numeral + date formatting
  intl: ^0.20.2

  # Realtime (chat / smart-request offers / notifications) — Pusher/Soketi protocol
  pusher_channels_flutter: ^2.2.1

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
