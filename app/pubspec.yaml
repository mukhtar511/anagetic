name: anaqatuk
description: أناقتك — سوق المصممات السعوديات (بيع وتأجير)
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^14.2.0

  # Networking
  dio: ^5.5.0

  # Secure token storage
  flutter_secure_storage: ^9.2.2

  # Fonts (El Messiri + IBM Plex Sans Arabic)
  google_fonts: ^6.2.1

  # Arabic-Indic numeral + date formatting
  intl: ^0.20.2

  # Realtime (chat / smart-request offers / notifications) — Pusher/Soketi protocol
  pusher_channels_flutter: ^2.2.1

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  image: ^4.9.1
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/

# App launcher icon — brand identity. Generate: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  adaptive_icon_background: "#6D28A9"
  adaptive_icon_foreground: "assets/splash_logo.png"

# Splash screen — royal purple field with the gold arch mark.
# Generate: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#6D28A9"
  image: assets/splash_logo.png
  android_12:
    color: "#6D28A9"
    image: assets/splash_logo.png
